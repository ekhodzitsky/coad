[project]
name = "coad-validator"
version = "0.6.7"
description = "Reference validator for Contract-Orchestrated Agent Development contracts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23",
  "pyyaml>=6.0",
]

[project.scripts]
coad = "coad_validator.coad_cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
