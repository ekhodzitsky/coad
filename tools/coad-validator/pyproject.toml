[project]
name = "coad-validator"
version = "0.1.0"
description = "Reference validator for Contract-Orchestrated Agent Development contracts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23",
  "pyyaml>=6.0",
]

[project.scripts]
coad-validate = "coad_validator.cli:main"
coad-pack = "coad_validator.pack_cli:main"
coad-status = "coad_validator.status_cli:main"
coad-proof-matrix = "coad_validator.proof_matrix_cli:main"
coad-graph = "coad_validator.graph_report_cli:main"
coad-schedule = "coad_validator.schedule_cli:main"
coad-ledger = "coad_validator.ledger_cli:main"
coad-profile = "coad_validator.profile_cli:main"
coad-policy = "coad_validator.policy_cli:main"
coad-drift = "coad_validator.drift_cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
